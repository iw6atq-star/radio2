name: Compila APK Radio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice dal Repository
      uses: actions/checkout@v4

    - name: Configura Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configura ambiente Android
      uses: android-actions/setup-android@v3

    - name: Forza Repository di Google nei Plugin
      run: |
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "RadioTemporeale"
        include(":app")
        EOF

    - name: Compila APK
      run: |
        gradle assembleDebug --no-daemon

    - name: Salva l'APK finale per il download
      uses: actions/upload-artifact@v4
      with:
        name: RadioTemporeale-App
        path: app/build/outputs/apk/debug/app-debug.apk
