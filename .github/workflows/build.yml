name: Compila APK Radio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice dal Repository
      uses: actions/checkout@v4

    - name: Configura Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Genera i file di avvio Gradle
      run: gradle wrapper --gradle-version 8.5

    - name: Assegna i permessi di esecuzione
      run: chmod +x gradlew

    - name: Compila l'applicazione con le impostazioni locali
      run: ./gradlew assembleDebug

    - name: Salva l'APK finale per il download
      uses: actions/upload-artifact@v4
      with:
        name: RadioTemporeale-App
        path: app/build/outputs/apk/debug/app-debug.apk
